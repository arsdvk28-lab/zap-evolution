name: Build Windows Product

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron_wrapper/package-lock.json

      - name: Install dependencies
        working-directory: electron_wrapper
        run: npm install

      - name: Build Electron App
        working-directory: electron_wrapper
        run: npm run build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: singularity-walker-windows
          path: electron_wrapper/dist_prod/*.exe
